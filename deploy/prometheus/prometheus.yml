# deploy/prometheus/prometheus.yml: Prometheus Scrape Configuration for AgentGuard

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "agentguard"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets: ["agentguard:8080"]
        labels:
          environment: "production"
          service: "mcp-agentguard"
