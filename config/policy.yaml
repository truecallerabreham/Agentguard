# config/policy.yaml: Declarative Role-Based Access Control (RBAC) & Tool Scopes for AgentGuard
# Deny-by-default: If a tool is not defined or the caller lacks required scopes, access is rejected.

default_action: deny

# Tool definitions and the OAuth scopes required to invoke them
tools:
  greet:
    description: "Public friendly greeting"
    required_scopes:
      - "tool:greet"
      - "tool:read"
      - "tool:*"

  add:
    description: "Mathematical computation"
    required_scopes:
      - "tool:math"
      - "tool:write"
      - "tool:*"

  echo:
    description: "Echo message back"
    required_scopes:
      - "tool:echo"
      - "tool:read"
      - "tool:*"

  get_customer:
    description: "Lookup confidential customer records by ID within tenant"
    required_scopes:
      - "tool:customers:read"
      - "tool:read"
      - "tool:*"

  customer_lookup:
    description: "Lookup customer profile by customer ID"
    required_scopes:
      - "tool:customers:read"
      - "tool:read"
      - "tool:*"

  order_lookup:
    description: "Lookup order records by customer ID or order ID"
    required_scopes:
      - "tool:orders:read"
      - "tool:read"
      - "tool:*"

  kb_search:
    description: "Search enterprise knowledge base articles"
    required_scopes:
      - "tool:kb:read"
      - "tool:read"
      - "tool:*"

  ticket_create:
    description: "Create customer support tickets"
    required_scopes:
      - "tool:tickets:write"
      - "tool:write"
      - "tool:*"

  postgres_query:
    description: "Execute SQL queries within tenant-isolated session"
    required_scopes:
      - "tool:db:query"
      - "tool:*"

  customer_360:
    description: "Synthesize customer profile, orders, and spending analytics"
    required_scopes:
      - "tool:c360:read"
      - "tool:read"
      - "tool:*"

  troubleshoot_inquiry:
    description: "Diagnose customer issue against order history and policies"
    required_scopes:
      - "tool:troubleshoot"
      - "tool:read"
      - "tool:*"

  start_return_remediation:
    description: "Initiate multi-phase stateful return and remediation workflow"
    required_scopes:
      - "tool:workflows:execute"
      - "tool:write"
      - "tool:*"

  get_workflow_status:
    description: "Query execution state and step progress for a workflow"
    required_scopes:
      - "tool:workflows:read"
      - "tool:read"
      - "tool:*"

  fetch_url:
    description: "Safely fetch external web resources protected against SSRF"
    required_scopes:
      - "tool:network:fetch"
      - "tool:read"
      - "tool:*"

  issue_high_risk_refund:
    description: "Execute high-risk financial refund (requires human confirmation)"
    required_scopes:
      - "tool:finance:refund"
      - "tool:write"
      - "tool:*"

  list_pending_approvals:
    description: "List pending human approval requests"
    required_scopes:
      - "tool:approvals:read"
      - "tool:read"
      - "tool:*"

  approve_action:
    description: "Authorize and approve a pending high-risk action"
    required_scopes:
      - "tool:approvals:decide"
      - "tool:write"
      - "tool:*"

  reject_action:
    description: "Reject and cancel a pending high-risk action"
    required_scopes:
      - "tool:approvals:decide"
      - "tool:write"
      - "tool:*"

# Standard Role definitions mapping high-level roles to granular tool scopes
roles:
  guest:
    description: "Unprivileged guest agent"
    scopes:
      - "tool:greet"

  reader:
    description: "Read-only agent (can view customer profile, orders, kb, customer 360, troubleshoot)"
    scopes:
      - "tool:greet"
      - "tool:echo"
      - "tool:customers:read"
      - "tool:orders:read"
      - "tool:kb:read"
      - "tool:c360:read"
      - "tool:troubleshoot"
      - "tool:workflows:read"
      - "tool:network:fetch"
      - "tool:approvals:read"

  analyst:
    description: "Operational agent with database query, ticketing, and workflow execution capabilities"
    scopes:
      - "tool:greet"
      - "tool:echo"
      - "tool:customers:read"
      - "tool:orders:read"
      - "tool:kb:read"
      - "tool:c360:read"
      - "tool:troubleshoot"
      - "tool:workflows:read"
      - "tool:workflows:execute"
      - "tool:tickets:write"
      - "tool:db:query"
      - "tool:network:fetch"
      - "tool:approvals:read"
      - "tool:finance:refund"

  supervisor:
    description: "Human supervisor authorized to approve or reject pending actions"
    scopes:
      - "tool:*"
      - "tool:approvals:decide"

  admin:
    description: "Platform administrator with full permissions"
    scopes:
      - "tool:*"
      - "tenant:*:impersonate"

