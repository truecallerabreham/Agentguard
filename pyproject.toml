[project]
name = "agentguard"
version = "0.1.0"
description = "A production-grade MCP server for enterprise agents."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]
