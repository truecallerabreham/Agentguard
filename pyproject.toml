[project]
name = "agentguard"
version = "0.1.0"
description = "A production-grade MCP server for enterprise agents."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2.0.0",
  "starlette>=0.37",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "asyncpg>=0.29",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

